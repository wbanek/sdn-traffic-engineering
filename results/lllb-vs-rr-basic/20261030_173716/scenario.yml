# Scenariusz startowy: LLLB vs round-robin na Clos 3x4 (lab SDN).
# Na podstawie test4.sh: UDP z -l 1400, starty rozsunięte o >= 2 s, wideo z DSCP 46.
# Przebieg: najpierw tło (3 strumienie, w tym dwa z różnych leafów do leaf4),
# po 10 s wideo leaf1 -> leaf4, w trakcie wideo dochodzi strumień 7 Mb/s do leaf4.
# Łącza spine -> leaf4 (3 x 10 Mb/s) dostają łącznie 22 Mb/s - decyzje kontrolera
# decydują, czy któreś łącze się przepełni i czyj ruch na tym straci.
name: lllb-vs-rr-basic
topology: sdn
variants: [lllb, rr]
duration: 60
warmup: 5
repetitions: 5
seed: 42
flows:
  - {id: bg1,  class: background, src: h1-bg1,   dst: h4-bg1,   proto: udp, rate: 6M, start: 0,  duration: 60}
  - {id: bg2,  class: background, src: h2-bg1,   dst: h4-bg2,   proto: udp, rate: 6M, start: 2,  duration: 58}
  - {id: bg3,  class: background, src: h2-bg2,   dst: h3-bg1,   proto: udp, rate: 5M, start: 4,  duration: 56}
  - {id: vid1, class: video,      src: h1-video, dst: h4-video, proto: udp, rate: 3M, dscp: 46, length: 1400, start: 10, duration: 40}
  - {id: bg4,  class: background, src: h3-bg2,   dst: h4-bg1,   proto: udp, rate: 7M, start: 20, duration: 30}
