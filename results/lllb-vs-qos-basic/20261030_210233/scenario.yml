# LLLB (B) vs QoS-Aware (C) na scenariuszu z konfliktem wideo / best-effort.
# Ten sam układ co lllb-vs-rr-basic: wideo leaf1 -> leaf4 (3 Mb/s, DSCP 46) + 4 strumienie tła,
# z których bg4 (7 Mb/s, t = 20 s) w LLLB trafiał na to samo łącze co wideo (spine1 -> leaf4).
# W C wideo ma rezerwową ścieżkę (spine1), a best-effort jest kierowany na spine2/spine3.
name: lllb-vs-qos-basic
topology: sdn
variants: [lllb, qos]
duration: 60
warmup: 5
repetitions: 5
seed: 42
flows:
  - {id: bg1,  class: background, src: h1-bg1,   dst: h4-bg1,   proto: udp, rate: 6M, start: 0,  duration: 60}
  - {id: bg2,  class: background, src: h2-bg1,   dst: h4-bg2,   proto: udp, rate: 6M, start: 2,  duration: 58}
  - {id: bg3,  class: background, src: h2-bg2,   dst: h3-bg1,   proto: udp, rate: 5M, start: 4,  duration: 56}
  - {id: vid1, class: video,      src: h1-video, dst: h4-video, proto: udp, rate: 3M, dscp: 46, length: 1400, start: 10, duration: 40}
  - {id: bg4,  class: background, src: h3-bg2,   dst: h4-bg1,   proto: udp, rate: 7M, start: 20, duration: 30}
