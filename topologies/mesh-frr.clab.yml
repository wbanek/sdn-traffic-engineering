name: mesh-frr
topology:
  defaults:
    kind: linux
  nodes:
    # --- CORE (tranzyt, bez hostów) ---
    # eth1 -> edge1 (10.10.3.0/31), eth2 -> edge2 (10.10.5.0/31), eth3 -> edge3 (10.10.7.0/31), eth4 -> core3 (10.10.11.0/31)
    core1:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/core1.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.1.1/32 dev lo
        - ip addr add 10.10.3.1/31 dev eth1
        - ip addr add 10.10.5.1/31 dev eth2
        - ip addr add 10.10.7.1/31 dev eth3
        - ip addr add 10.10.11.0/31 dev eth4
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth4  root tbf rate 10mbit  burst 100kbit latency 50ms
    # eth1 -> edge1 (10.10.4.0/31), eth2 -> edge3 (10.10.8.0/31), eth3 -> edge4 (10.10.9.0/31), eth4 -> core3 (10.10.12.0/31)
    core2:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/core2.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.1.2/32 dev lo
        - ip addr add 10.10.4.1/31 dev eth1
        - ip addr add 10.10.8.1/31 dev eth2
        - ip addr add 10.10.9.1/31 dev eth3
        - ip addr add 10.10.12.0/31 dev eth4
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth4  root tbf rate 10mbit  burst 100kbit latency 50ms
    # eth1 -> edge2 (10.10.6.0/31), eth2 -> edge4 (10.10.10.0/31), eth3 -> core1 (10.10.11.0/31), eth4 -> core2 (10.10.12.0/31)
    core3:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/core3.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.1.3/32 dev lo
        - ip addr add 10.10.6.1/31 dev eth1
        - ip addr add 10.10.10.1/31 dev eth2
        - ip addr add 10.10.11.1/31 dev eth3
        - ip addr add 10.10.12.1/31 dev eth4
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth4  root tbf rate 10mbit  burst 100kbit latency 50ms

    # --- EDGE (z hostami) ---
    # eth1 -> edge2 (10.10.1.0/31), eth2 -> core1 (10.10.3.0/31), eth3 -> core2 (10.10.4.0/31), eth10-12 -> br-hosts (h1-*)
    edge1:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/edge1.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.2.1/32 dev lo
        - ip addr add 10.10.1.0/31 dev eth1
        - ip addr add 10.10.3.0/31 dev eth2
        - ip addr add 10.10.4.0/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.1.1/24 dev br-hosts
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
    # eth1 -> edge1 (10.10.1.0/31), eth2 -> core1 (10.10.5.0/31), eth3 -> core3 (10.10.6.0/31), eth10-12 -> br-hosts (h2-*)
    edge2:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/edge2.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.2.2/32 dev lo
        - ip addr add 10.10.1.1/31 dev eth1
        - ip addr add 10.10.5.0/31 dev eth2
        - ip addr add 10.10.6.0/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.2.1/24 dev br-hosts
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
    # eth1 -> edge4 (10.10.2.0/31), eth2 -> core1 (10.10.7.0/31), eth3 -> core2 (10.10.8.0/31), eth10-12 -> br-hosts (h3-*)
    edge3:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/edge3.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.2.3/32 dev lo
        - ip addr add 10.10.2.0/31 dev eth1
        - ip addr add 10.10.7.0/31 dev eth2
        - ip addr add 10.10.8.0/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.3.1/24 dev br-hosts
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
    # eth1 -> edge3 (10.10.2.0/31), eth2 -> core2 (10.10.9.0/31), eth3 -> core3 (10.10.10.0/31), eth10-12 -> br-hosts (h4-*)
    edge4:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/mesh/edge4.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
        - ip addr add 10.255.2.4/32 dev lo
        - ip addr add 10.10.2.1/31 dev eth1
        - ip addr add 10.10.9.0/31 dev eth2
        - ip addr add 10.10.10.0/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.4.1/24 dev br-hosts
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms

    # --- HOSTY ---
    h1-video:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h1-bg1:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.1.11/24 dev eth1
        - ip route replace default via 10.1.1.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h1-bg2:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.1.12/24 dev eth1
        - ip route replace default via 10.1.1.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h2-video:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.2.10/24 dev eth1
        - ip route replace default via 10.1.2.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h2-bg1:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.2.11/24 dev eth1
        - ip route replace default via 10.1.2.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h2-bg2:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.2.12/24 dev eth1
        - ip route replace default via 10.1.2.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h3-video:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.3.10/24 dev eth1
        - ip route replace default via 10.1.3.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h3-bg1:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.3.11/24 dev eth1
        - ip route replace default via 10.1.3.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h3-bg2:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.3.12/24 dev eth1
        - ip route replace default via 10.1.3.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h4-video:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.4.10/24 dev eth1
        - ip route replace default via 10.1.4.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h4-bg1:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.4.11/24 dev eth1
        - ip route replace default via 10.1.4.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h4-bg2:
      image: wbitt/network-multitool
      exec:
        - ip addr add 10.1.4.12/24 dev eth1
        - ip route replace default via 10.1.4.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms

  links:
    # --- EDGE <-> EDGE ---
    - endpoints: ["edge1:eth1", "edge2:eth1"]
    - endpoints: ["edge3:eth1", "edge4:eth1"]

    # --- EDGE <-> CORE ---
    - endpoints: ["edge1:eth2", "core1:eth1"]
    - endpoints: ["edge1:eth3", "core2:eth1"]
    - endpoints: ["edge2:eth2", "core1:eth2"]
    - endpoints: ["edge2:eth3", "core3:eth1"]
    - endpoints: ["edge3:eth2", "core1:eth3"]
    - endpoints: ["edge3:eth3", "core2:eth2"]
    - endpoints: ["edge4:eth2", "core2:eth3"]
    - endpoints: ["edge4:eth3", "core3:eth2"]

    # --- CORE <-> CORE ---
    - endpoints: ["core1:eth4", "core3:eth3"]
    - endpoints: ["core2:eth4", "core3:eth4"]

    # --- HOSTY <-> EDGE1 ---
    - endpoints: ["h1-video:eth1", "edge1:eth10"]
    - endpoints: ["h1-bg1:eth1", "edge1:eth11"]
    - endpoints: ["h1-bg2:eth1", "edge1:eth12"]

    # --- HOSTY <-> EDGE2 ---
    - endpoints: ["h2-video:eth1", "edge2:eth10"]
    - endpoints: ["h2-bg1:eth1", "edge2:eth11"]
    - endpoints: ["h2-bg2:eth1", "edge2:eth12"]

    # --- HOSTY <-> EDGE3 ---
    - endpoints: ["h3-video:eth1", "edge3:eth10"]
    - endpoints: ["h3-bg1:eth1", "edge3:eth11"]
    - endpoints: ["h3-bg2:eth1", "edge3:eth12"]

    # --- HOSTY <-> EDGE4 ---
    - endpoints: ["h4-video:eth1", "edge4:eth10"]
    - endpoints: ["h4-bg1:eth1", "edge4:eth11"]
    - endpoints: ["h4-bg2:eth1", "edge4:eth12"]