name: sdn
topology:
  nodes:
  # --- CONTROLLER ---
    ryu-controller: 
      kind: linux 
      image: sdn-ryu:4.34
      mgmt-ipv4: 172.20.20.100
      cmd: ryu-manager --verbose --ofp-tcp-listen-port 6653 ryu.app.ofctl_rest


    spine1: 
      kind: linux 
      image: kathara/sdn:latest 
      exec: 
        - /usr/share/openvswitch/scripts/ovs-ctl start 
        - ovs-vsctl add-br br0 
        - ovs-vsctl set bridge br0 protocols=OpenFlow13 
        - ovs-vsctl set-controller br0 tcp:172.20.20.100:6653 
        - ovs-vsctl set-fail-mode br0 secure 
        - ovs-vsctl add-port br0 eth1 
        - ovs-vsctl add-port br0 eth2 
        - ovs-vsctl add-port br0 eth3 
        - ovs-vsctl add-port br0 eth4 
        - tc qdisc add dev eth1 root tbf rate 10mbit burst 32kbit latency 50ms 
        - tc qdisc add dev eth2 root tbf rate 10mbit burst 32kbit latency 50ms 
        - tc qdisc add dev eth3 root tbf rate 10mbit burst 32kbit latency 50ms 
        - tc qdisc add dev eth4 root tbf rate 10mbit burst 32kbit latency 50ms
    spine2: 
      kind: linux 
      image: kathara/sdn:latest 
