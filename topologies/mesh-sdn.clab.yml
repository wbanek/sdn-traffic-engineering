name: mesh-sdn
topology:
  nodes:
  # --- CONTROLLER ---
    ryu-controller:
      kind: linux
      image: sdn-ryu:4.34
      mgmt-ipv4: 172.20.20.101
      binds:
        - ../controllers:/controllers
        - ../topologies:/topologies:ro
      env:
        TOPO_FILE: /topologies/mesh-sdn.clab.yml
        POLICY: ${POLICY:=lllb}
        RESERVE_PCT: ${RESERVE_PCT:=100}
      cmd: ryu-manager --verbose --ofp-tcp-listen-port 6653 /controllers/controller_ryu.py

  # --- CORE (tranzyt, bez hostów) ---
    # eth1 -> edge1, eth2 -> edge2, eth3 -> edge3, eth4 -> core3
    core1:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000011
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth4  -- set Interface eth4  ofport_request=4
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth4  root tbf rate 10mbit  burst 100kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653
    # eth1 -> edge1, eth2 -> edge3, eth3 -> edge4, eth4 -> core3
    core2:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000012
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth4  -- set Interface eth4  ofport_request=4
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth4  root tbf rate 10mbit  burst 100kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653
    # eth1 -> edge2, eth2 -> edge4, eth3 -> core1, eth4 -> core2
    core3:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000013
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth4  -- set Interface eth4  ofport_request=4
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth4  root tbf rate 10mbit  burst 100kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653

  # --- EDGE (z hostami) ---
    # eth1 -> edge2, eth2 -> core1, eth3 -> core2, eth10-12 -> hosty h1-*
    edge1:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000001
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth10 -- set Interface eth10 ofport_request=10
        - ovs-vsctl add-port br0 eth11 -- set Interface eth11 ofport_request=11
        - ovs-vsctl add-port br0 eth12 -- set Interface eth12 ofport_request=12
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653
    # eth1 -> edge1, eth2 -> core1, eth3 -> core3, eth10-12 -> hosty h2-*
    edge2:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000002
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth10 -- set Interface eth10 ofport_request=10
        - ovs-vsctl add-port br0 eth11 -- set Interface eth11 ofport_request=11
        - ovs-vsctl add-port br0 eth12 -- set Interface eth12 ofport_request=12
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653
    # eth1 -> edge4, eth2 -> core1, eth3 -> core2, eth10-12 -> hosty h3-*
    edge3:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000003
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth10 -- set Interface eth10 ofport_request=10
        - ovs-vsctl add-port br0 eth11 -- set Interface eth11 ofport_request=11
        - ovs-vsctl add-port br0 eth12 -- set Interface eth12 ofport_request=12
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653
    # eth1 -> edge3, eth2 -> core2, eth3 -> core3, eth10-12 -> hosty h4-*
    edge4:
      kind: linux
      image: kathara/sdn:latest
      exec:
        - /usr/share/openvswitch/scripts/ovs-ctl start
        - ovs-vsctl add-br br0
        - ovs-vsctl set-fail-mode br0 secure
        - ovs-vsctl set bridge br0 protocols=OpenFlow13
        - ovs-vsctl set bridge br0 other-config:datapath-id=0000000000000004
        - ovs-vsctl add-port br0 eth1  -- set Interface eth1  ofport_request=1
        - ovs-vsctl add-port br0 eth2  -- set Interface eth2  ofport_request=2
        - ovs-vsctl add-port br0 eth3  -- set Interface eth3  ofport_request=3
        - ovs-vsctl add-port br0 eth10 -- set Interface eth10 ofport_request=10
        - ovs-vsctl add-port br0 eth11 -- set Interface eth11 ofport_request=11
        - ovs-vsctl add-port br0 eth12 -- set Interface eth12 ofport_request=12
        - tc qdisc add dev eth1  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth2  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth3  root tbf rate 10mbit  burst 100kbit latency 50ms
        - tc qdisc add dev eth10 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth11 root tbf rate 100mbit burst 320kbit latency 50ms
        - tc qdisc add dev eth12 root tbf rate 100mbit burst 320kbit latency 50ms
        - ovs-vsctl set-controller br0 tcp:172.20.20.101:6653

    # --- HOSTY ---
    h1-video:
      kind: linux
      image: wbitt/network-multitool
      exec:
        - ip link set dev eth1 address 02:00:01:00:00:0a
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h1-bg1:
      kind: linux
      image: wbitt/network-multitool
      exec:
        - ip link set dev eth1 address 02:00:01:00:00:0b
        - ip addr add 10.1.1.11/24 dev eth1
        - ip route replace default via 10.1.1.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h1-bg2:
      kind: linux
      image: wbitt/network-multitool
      exec:
        - ip link set dev eth1 address 02:00:01:00:00:0c
        - ip addr add 10.1.1.12/24 dev eth1
        - ip route replace default via 10.1.1.1
        - tc qdisc add dev eth1 root tbf rate 100mbit burst 320kbit latency 50ms
    h2-video:
      kind: linux
      image: wbitt/network-multitool
      exec:
        - ip link set dev eth1 address 02:00:02:00:00:0a
