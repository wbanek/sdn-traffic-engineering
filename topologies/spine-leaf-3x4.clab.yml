name: spine-leaf-3x4
topology:
  defaults:
    kind: linux
  nodes:
    spine1:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/spines/spine1.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.1.1/32 dev lo
        - ip addr add 10.10.1.0/31 dev eth1
        - ip addr add 10.10.1.2/31 dev eth2
        - ip addr add 10.10.1.4/31 dev eth3
        - ip addr add 10.10.1.6/31 dev eth4
    spine2:
      image: quay.io/frrouting/frr:9.0.1
      binds:
      - ../configs/frr/daemons:/etc/frr/daemons
      - ../configs/frr/spines/spine2.conf:/etc/frr/ospfd.conf
      - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.1.2/32 dev lo
        - ip addr add 10.10.2.0/31 dev eth1
        - ip addr add 10.10.2.2/31 dev eth2
        - ip addr add 10.10.2.4/31 dev eth3
        - ip addr add 10.10.2.6/31 dev eth4
    spine3:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/spines/spine3.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.1.3/32 dev lo
        - ip addr add 10.10.3.0/31 dev eth1
        - ip addr add 10.10.3.2/31 dev eth2
        - ip addr add 10.10.3.4/31 dev eth3
        - ip addr add 10.10.3.6/31 dev eth4

    # --- LEAFS ---
    leaf1:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/leafs/leaf1.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.2.1/32 dev lo
        - ip addr add 10.10.1.1/31 dev eth1
        - ip addr add 10.10.2.1/31 dev eth2
        - ip addr add 10.10.3.1/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.1.1/24 dev br-hosts
    leaf2:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/leafs/leaf2.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec: 
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.2.2/32 dev lo
        - ip addr add 10.10.1.3/31 dev eth1
        - ip addr add 10.10.2.3/31 dev eth2
        - ip addr add 10.10.3.3/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.2.1/24 dev br-hosts
    leaf3:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/leafs/leaf3.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.2.3/32 dev lo
        - ip addr add 10.10.1.5/31 dev eth1
        - ip addr add 10.10.2.5/31 dev eth2
        - ip addr add 10.10.3.5/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.3.1/24 dev br-hosts
    leaf4:
      image: quay.io/frrouting/frr:9.0.1
      binds:
        - ../configs/frr/daemons:/etc/frr/daemons
        - ../configs/frr/leafs/leaf4.conf:/etc/frr/ospfd.conf
        - ../configs/frr/vtysh.conf:/etc/frr/vtysh.conf 
      exec:
        - sysctl -w net.ipv4.ip_forward=1                                            
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1 
        - ip addr add 10.255.2.4/32 dev lo
        - ip addr add 10.10.1.7/31 dev eth1
        - ip addr add 10.10.2.7/31 dev eth2
        - ip addr add 10.10.3.7/31 dev eth3
        - ip link add name br-hosts type bridge
        - ip link set br-hosts up
        - ip link set eth10 master br-hosts
        - ip link set eth11 master br-hosts
        - ip link set eth12 master br-hosts
        - ip link set eth10 up
        - ip link set eth11 up
        - ip link set eth12 up
        - ip addr add 10.1.4.1/24 dev br-hosts

    # --- HOSTY ---
    h1-video:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1
    h1-bg1:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.1.11/24 dev eth1
        - ip route replace default via 10.1.1.1
    h1-bg2:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.1.12/24 dev eth1
        - ip route replace default via 10.1.1.1
    h2-video:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.2.10/24 dev eth1
        - ip route replace default via 10.1.2.1
    h2-bg1:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.2.11/24 dev eth1
        - ip route replace default via 10.1.2.1
    h2-bg2:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.2.12/24 dev eth1
        - ip route replace default via 10.1.2.1
    h3-video:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.3.10/24 dev eth1
        - ip route replace default via 10.1.3.1
    h3-bg1:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.3.11/24 dev eth1
        - ip route replace default via 10.1.3.1
    h3-bg2:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.3.12/24 dev eth1
        - ip route replace default via 10.1.3.1
    h4-video:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.4.10/24 dev eth1
        - ip route replace default via 10.1.4.1
    h4-bg1:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.4.11/24 dev eth1
        - ip route replace default via 10.1.4.1
    h4-bg2:
      image: wbitt/network-multitool
      exec: 
        - ip addr add 10.1.4.12/24 dev eth1
        - ip route replace default via 10.1.4.1

  links:
    # --- POŁĄCZENIA LEAF 1 -> SPINE ---
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf1:eth3", "spine3:eth1"]

    # --- POŁĄCZENIA LEAF 2 -> SPINE ---
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf2:eth3", "spine3:eth2"]

    # --- POŁĄCZENIA LEAF 3 -> SPINE ---
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf3:eth2", "spine2:eth3"]
    - endpoints: ["leaf3:eth3", "spine3:eth3"]


    # --- POŁĄCZENIA LEAF 4 -> SPINE ---
    - endpoints: ["leaf4:eth1", "spine1:eth4"]
    - endpoints: ["leaf4:eth2", "spine2:eth4"]
    - endpoints: ["leaf4:eth3", "spine3:eth4"]

    # --- POŁĄCZENIA HOSTÓW DO LEAF 1 ---
    - endpoints: ["h1-video:eth1", "leaf1:eth10"]
    - endpoints: ["h1-bg1:eth1", "leaf1:eth11"]
    - endpoints: ["h1-bg2:eth1", "leaf1:eth12"]
    
     # --- POŁĄCZENIA HOSTÓW DO LEAF 2 ---
    - endpoints: ["h2-video:eth1", "leaf2:eth10"]
    - endpoints: ["h2-bg1:eth1", "leaf2:eth11"]
    - endpoints: ["h2-bg2:eth1", "leaf2:eth12"]
    
     # --- POŁĄCZENIA HOSTÓW DO LEAF 3 ---
    - endpoints: ["h3-video:eth1", "leaf3:eth10"]
    - endpoints: ["h3-bg1:eth1", "leaf3:eth11"]
    - endpoints: ["h3-bg2:eth1", "leaf3:eth12"]
    
     # --- POŁĄCZENIA HOSTÓW DO LEAF 4 ---
    - endpoints: ["h4-video:eth1", "leaf4:eth10"]
    - endpoints: ["h4-bg1:eth1", "leaf4:eth11"]    
    - endpoints: ["h4-bg2:eth1", "leaf4:eth12"]
